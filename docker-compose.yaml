services:
  telegram_media_downloader:
    image: roninriddle/telegram_media_downloader:0.0.1
    container_name: telegram_media_downloader
    ports:
      - "5055:5000"
    environment:
      TMD_CONFIG_FILE: /config/config.yaml
      TMD_DATA_FILE: /config/data.yaml
      TMD_SAVE_PATH: /app/downloads
      TZ: Asia/Shanghai
    volumes:
      - ./config:/config
      - ./downloads:/app/downloads
      - ./log:/app/log
      - ./sessions:/app/sessions
      - ./temp:/app/temp
      - ${HOME}/.config/rclone:/root/.config/rclone
    restart: unless-stopped
